<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Methods</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }body {
  background: #0f1115;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.card {
  background: #171a21;
  border: 1px solid #2a2f3a;
  border-radius: 18px;
  padding: 18px;
  transition: 0.2s ease;
}

.card:hover {
  transform: translateY(-2px);
  border-color: #3a4250;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.title {
  font-size: 18px;
  font-weight: 700;
}

.status {
  font-size: 12px;
  color: #7CFF9B;
  background: rgba(124,255,155,0.1);
  padding: 5px 10px;
  border-radius: 999px;
}

.desc {
  font-size: 14px;
  color: #b8c0cc;
  margin-bottom: 15px;
  line-height: 1.5;
}

.btn {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 13px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  text-align: center;
  transition: 0.2s ease;
}

.upi {
  background: #4f46e5;
  color: white;
}

.crypto {
  background: #f7931a;
  color: black;
}

.binance {
  background: #f3ba2f;
  color: black;
}

.btn:hover {
  opacity: 0.9;
  transform: scale(0.99);
}

.wallet {
  margin-top: 10px;
  font-size: 12px;
  color: #8e98a8;
  word-break: break-all;
  line-height: 1.5;
}

.footer {
  text-align: center;
  margin-top: 10px;
  color: #6b7280;
  font-size: 12px;
}

  </style>
</head>
<body>
  <div class="container" id="app"></div>  <script>
    const path = window.location.pathname.toLowerCase();

    function card(title, status, desc, buttonClass, buttonText, href, extra = '') {
      return `
        <div class="card">
          <div class="top">
            <div class="title">${title}</div>
            <div class="status">${status}</div>
          </div>

          <div class="desc">${desc}</div>

          <a class="btn ${buttonClass}" href="${href}">
            ${buttonText}
          </a>

          ${extra}
        </div>
      `;
    }

    let content = '';

    if (path === '/upi') {
      content = card(
        '🇮🇳 UPI',
        'INSTANT',
        'Google Pay • PhonePe • Paytm',
        'upi',
        'Pay via UPI',
        'upi://pay?pa=digamberraj7903@ptaxis&pn=Digamber%20Raj&cu=INR'
      );
    }

    else if (path === '/crypto') {
      content = card(
        '₿ CRYPTO',
        '1-5 MIN',
        'USDT • BTCB • LTC (BEP20)',
        'crypto',
        'Open Wallet',
        'https://link.trustwallet.com/send?coin=20000714&address=0x33aca3a213443730cf548b77b520f4f87df447ec',
        '<div class="wallet">0x33aca3a213443730cf548b77b520f4f87df447ec</div>'
      );
    }

    else if (path === '/binance') {
      content = `
        <div class="card">
          <div class="top">
            <div class="title">🟡 BINANCE UID</div>
            <div class="status">FASTEST</div>
          </div>

          <div class="desc">
            Internal Binance transfer supported
          </div>

          <button class="btn binance" onclick="copyUID()">
            Copy Binance UID
          </button>

          <div class="wallet">814429508</div>
        </div>
      `;
    }

    else {
      content = `
        <div class="card">
          <div class="top">
            <div class="title">💳 PAYMENT METHODS</div>
            <div class="status">ACTIVE</div>
          </div>

          <div class="desc">
            Select a payment method below
          </div>

          <a class="btn upi" href="/upi">UPI</a>
          <br><br>
          <a class="btn crypto" href="/crypto">CRYPTO</a>
          <br><br>
          <a class="btn binance" href="/binance">BINANCE UID</a>
        </div>
      `;
    }

    document.getElementById('app').innerHTML = content;

    function copyUID() {
      navigator.clipboard.writeText('814429508');
      alert('Binance UID copied');
    }
  </script></body>
</html>
