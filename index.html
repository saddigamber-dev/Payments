<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Secure Payment Gateway</title>

<style>
/* ==========================================================================
   1. ENTERPRISE CSS VARIABLES & DESIGN TOKENS
   ========================================================================== */
:root {
    /* Core Grayscale - Apple/Stripe inspired minimal dark mode */
    --gray-50: #fafafa;
    --gray-100: #f5f5f5;
    --gray-200: #e5e5e5;
    --gray-300: #d4d4d4;
    --gray-400: #a3a3a3;
    --gray-500: #737373;
    --gray-600: #525252;
    --gray-700: #404040;
    --gray-800: #262626;
    --gray-900: #171717;
    --gray-950: #0a0a0a;

    /* Semantic Colors */
    --primary: #ffffff;
    --primary-inv: #000000;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --success-bg: rgba(22, 163, 74, 0.1);
    --danger: #dc2626;
    --danger-bg: rgba(220, 38, 38, 0.1);
    --warning: #ca8a04;

    /* Surface & Background */
    --bg-base: var(--gray-950);
    --bg-surface: var(--gray-900);
    --bg-surface-hover: var(--gray-800);
    --border-subtle: var(--gray-800);
    --border-focus: var(--gray-600);

    /* Typography */
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

    /* Spacing & Metrics */
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 24px;
    --radius-full: 9999px;

    /* Safe Areas for Mobile (Notches/Home Bars) */
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
}

/* ==========================================================================
   2. CSS RESET & NORMALIZATION
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-family: var(--font-sans); -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
body { background-color: var(--bg-base); color: var(--gray-50); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; background: none; border: none; outline: none; }
button { cursor: pointer; }
img, svg { display: block; max-width: 100%; }

/* Remove tap highlight on mobile for clean feel */
* { -webkit-tap-highlight-color: transparent; }

/* ==========================================================================
   3. LAYOUT & GRID UTILITIES
   ========================================================================== */
.app-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: var(--safe-top) 16px calc(var(--safe-bottom) + 24px) 16px;
    position: relative;
}

.view-section {
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
    /* Strict minimal functional fade, no bouncy nonsense */
    animation: simpleFadeIn 0.2s ease-out forwards;
}

@keyframes simpleFadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ==========================================================================
   4. TYPOGRAPHY CLASSES
   ========================================================================== */
.text-h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; color: var(--gray-50); }
.text-h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--gray-50); }
.text-body { font-size: 15px; color: var(--gray-400); line-height: 1.5; }
.text-body-sm { font-size: 13px; color: var(--gray-500); }
.text-mono { font-family: var(--font-mono); letter-spacing: -0.05em; }
.text-center { text-align: center; }
.font-medium { font-weight: 500; }
.font-semibold { font-weight: 600; }
.text-success { color: var(--success); }

/* ==========================================================================
   5. COMPONENTS: CARDS & CONTAINERS
   ========================================================================== */
.card {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: 20px;
    width: 100%;
}

.list-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.list-item {
    display: flex;
    align-items: center;
    padding: 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    transition: background-color 0.15s ease, border-color 0.15s ease;
}

.list-item:hover, .list-item:active {
    background: var(--bg-surface-hover);
    border-color: var(--border-focus);
}

.list-item-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--gray-800);
    border-radius: var(--radius-sm);
    margin-right: 16px;
    color: var(--gray-50);
}

.list-item-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.list-item-title { font-size: 15px; font-weight: 600; color: var(--gray-50); }
.list-item-subtitle { font-size: 13px; color: var(--gray-400); }
.list-item-action { color: var(--gray-500); display: flex; align-items: center; }

/* ==========================================================================
   6. COMPONENTS: BUTTONS
   ========================================================================== */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border-radius: var(--radius-md);
    font-size: 15px;
    font-weight: 600;
    transition: all 0.15s ease;
}

.btn-primary {
    background: var(--primary);
    color: var(--primary-inv);
}

.btn-primary:active { background: var(--gray-200); }

.btn-secondary {
    background: var(--bg-surface);
    color: var(--gray-50);
    border: 1px solid var(--border-subtle);
}

.btn-secondary:active { background: var(--gray-800); }

.btn-icon-only {
    padding: 12px;
    background: transparent;
    color: var(--gray-400);
    border-radius: var(--radius-md);
}
.btn-icon-only:hover, .btn-icon-only:active {
    background: var(--gray-800);
    color: var(--gray-50);
}

.btn-disabled {
    opacity: 0.5;
    pointer-events: none;
}

/* ==========================================================================
   7. COMPONENTS: INPUTS & FORMS
   ========================================================================== */
.input-wrapper {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.input-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-400);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.input-control {
    width: 100%;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 16px;
    font-size: 16px;
    color: var(--gray-50);
    transition: border-color 0.15s ease;
}

.input-control:focus {
    border-color: var(--gray-400);
}

.input-control::placeholder {
    color: var(--gray-600);
}

/* Currency Input Special Styling */
.currency-input-group {
    position: relative;
    display: flex;
    align-items: center;
}

.currency-symbol {
    position: absolute;
    left: 20px;
    font-size: 24px;
    font-weight: 500;
    color: var(--gray-400);
}

.currency-input {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    padding: 24px 20px 24px 45px;
    font-size: 28px;
    font-weight: 600;
    color: var(--gray-50);
    font-family: var(--font-mono);
}
.currency-input:focus { border-color: var(--gray-400); }

/* ==========================================================================
   8. COMPONENTS: QR CODES & DATA DISPLAY
   ========================================================================== */
.qr-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: var(--gray-50);
    border-radius: var(--radius-lg);
    margin: 16px 0;
}

.qr-image-wrapper {
    width: 220px;
    height: 220px;
    position: relative;
}

.qr-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.qr-skeleton {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--gray-200);
    border-radius: var(--radius-sm);
    animation: pulseBg 1.5s infinite;
}

@keyframes pulseBg {
    0% { opacity: 0.6; }
    50% { opacity: 1; }
    100% { opacity: 0.6; }
}

.data-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    margin-bottom: 16px;
}

.data-row-col { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.data-value { font-size: 15px; font-weight: 600; color: var(--gray-50); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }

/* ==========================================================================
   9. COMPONENTS: NAVIGATION & TOASTS
   ========================================================================== */
.top-bar {
    display: flex;
    align-items: center;
    margin-bottom: 24px;
    padding-top: 12px;
}

.back-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--gray-400);
    font-size: 15px;
    font-weight: 500;
}
.back-button:active { color: var(--gray-50); }

.toast-container {
    position: fixed;
    bottom: var(--safe-bottom);
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
    width: calc(100% - 32px);
    max-width: 400px;
}

.toast {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--gray-800);
    border: 1px solid var(--gray-700);
    color: var(--gray-50);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    animation: toastSlideUp 0.3s ease forwards;
}

@keyframes toastSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Segmented Control (Tabs) */
.segmented-control {
    display: flex;
    background: var(--bg-surface);
    padding: 4px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-subtle);
    margin-bottom: 16px;
}

.segment-btn {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-400);
    border-radius: var(--radius-sm);
    transition: all 0.15s ease;
}

.segment-btn.active {
    background: var(--gray-800);
    color: var(--gray-50);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

/* Security Badge */
.security-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: 12px;
    color: var(--gray-500);
    margin-top: 32px;
}
</style>
</head>

<script>
/**
 * ==========================================================================
 * ENTERPRISE PAYMENT PROTOCOL - VANILLA JS ARCHITECTURE
 * * Description: A highly optimized, dependency-free Single Page Application 
 * designed for strict mobile-first rendering and maximum stability.
 * * Includes: 
 * - Virtual Router
 * - Component Lifecycle Engine
 * - Global State Management
 * - Clipboard API Wrappers
 * - Utility Formatting
 * ==========================================================================
 */

/**
 * 1. CONFIGURATION LAYER
 * Centralized immutable state config.
 */
const SYS_CONFIG = Object.freeze({
    UPI: Object.freeze({
        VPA: "Smgrowmarthq@upi",
        NAME: "Smgrowmart HQ",
        CURRENCY: "INR"
    }),
    CRYPTO: Object.freeze({
        WALLET: "0x33aca3a213443730cf548b77b520f4f87df447ec",
        NETWORKS: ['USDT', 'BTCB', 'ETH', 'BNB'],
        STANDARD: 'BEP20'
    }),
    BINANCE: Object.freeze({
        UID: "814429508"
    }),
    UI: Object.freeze({
        QR_API: "https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data="
    })
});

/**
 * 2. UTILITY LAYER
 * Pure functions for data transformation and side-effects.
 */
class CoreUtils {
    /**
     * Deep clones an object
     * @param {Object} obj 
     * @returns {Object}
     */
    static clone(obj) {
        return JSON.parse(JSON.stringify(obj));
    }

    /**
     * Generates a Google Chart QR code URL
     * @param {string} data - The data to encode
     * @returns {string} - Full URL string
     */
    static getQRUrl(data) {
        return `${SYS_CONFIG.UI.QR_API}${encodeURIComponent(data)}`;
    }

    /**
     * Debounces a function execution
     * @param {Function} func 
     * @param {number} wait 
     * @returns {Function}
     */
    static debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => { clearTimeout(timeout); func(...args); };
            clearTimeout(timeout); timeout = setTimeout(later, wait);
        };
    }

    /**
     * Formats number to INR currency string
     * @param {number|string} amount 
     * @returns {string}
     */
    static formatINR(amount) {
        const num = parseFloat(amount);
        if (isNaN(num)) return '0.00';
        return new Intl.NumberFormat('en-IN', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }).format(num);
    }

    /**
     * Securely copies text to clipboard and triggers Toast
     * @param {string} text 
     * @param {string} successMsg 
     */
    static async copyText(text, successMsg = "Copied to clipboard") {
        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                // Legacy fallback
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.left = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                } catch (err) {
                    console.error('Fallback: Oops, unable to copy', err);
                }
                document.body.removeChild(textArea);
            }
            ToastSystem.show(successMsg, 'success');
        } catch (err) {
            console.error('Copy failed', err);
            ToastSystem.show('Copy failed. Please manually select text.', 'error');
        }
    }
}

/**
 * 3. TOAST NOTIFICATION ENGINE
 * Handles non-blocking UI alerts.
 */
class ToastSystem {
    /**
     * @param {string} message 
     * @param {string} type - 'success' | 'error' | 'info'
     */
    static show(message, type = 'info') {
        const root = document.getElementById('toast-root');
        const toast = document.createElement('div');
        toast.className = 'toast';
        
        let iconName = 'check';
        if (type === 'error') iconName = 'shield'; // Reusing shield for general alert in minimal setup
        
        toast.innerHTML = `
            <svg width="18" height="18" style="color: ${type === 'success' ? 'var(--success)' : 'inherit'}">
                <use href="#icon-${iconName}"></use>
            </svg>
            <span>${message}</span>
        `;
        
        root.appendChild(toast);
        
        // Auto remove
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            toast.style.transition = 'all 0.2s ease';
            setTimeout(() => {
                if (root.contains(toast)) root.removeChild(toast);
            }, 200);
        }, 2500);
    }
}

/**
 * 4. UI COMPONENT FACTORY
 * Generates reusable HTML string components.
 */
class UIFactory {
    /**
     * Renders SVG icon
     */
    static icon(name, size = 24, className = '') {
        return `<svg width="${size}" height="${size}" class="${className}"><use href="#icon-${name}"></use></svg>`;
    }

    /**
     * Renders standard top navigation bar
     */
    static navBar(backPath = '/') {
        return `
            <div class="top-bar">
                <a href="javascript:void(0)" onclick="AppRouter.navigate('${backPath}')" class="back-button">
                    ${this.icon('arrow-left', 20)} Back
                </a>
            </div>
        `;
    }

    /**
     * Renders standard page header
     */
    static header(title, subtitle) {
        return `
            <header style="margin-bottom: 24px;">
                <h1 class="text-h1">${title}</h1>
                <p class="text-body mt-2">${subtitle}</p>
            </header>
        `;
    }

    /**
     * Renders secure footer badge
     */
    static footer() {
        return `
            <div style="text-align: center; width: 100%;">
                <div class="security-badge">
                    ${this.icon('shield', 14)} Enterprise 256-bit Encryption
                </div>
            </div>
        `;
    }

    /**
     * Renders standard QR Display Area
     */
    static qrDisplay(dataUrl, id = "qr-image") {
        return `
            <div class="qr-container">
                <div class="qr-image-wrapper">
                    <div class="qr-skeleton" id="${id}-skeleton"></div>
                    <img src="${dataUrl}" id="${id}" class="qr-image" style="opacity: 0; transition: opacity 0.2s"
                         onload="document.getElementById('${id}-skeleton').style.display='none'; this.style.opacity='1';" 
                         alt="Payment QR Code">
                </div>
            </div>
        `;
    }

    /**
     * Renders copyable data row
     */
    static dataRow(label, value, copyMsg) {
        return `
            <div class="data-row" onclick="CoreUtils.copyText('${value}', '${copyMsg}')" style="cursor: pointer;">
                <div class="data-row-col">
                    <span class="input-label">${label}</span>
                    <span class="data-value">${value}</span>
                </div>
                <button class="btn-icon-only" aria-label="Copy">
                    ${this.icon('copy', 20)}
                </button>
            </div>
        `;
    }
}

/**
 * 5. VIEW CONTROLLERS
 * Encapsulate specific page logic and rendering.
 */

class UPICustomView {
    static render() {
        // Render shell. Event listeners handle the reactivity.
        return `
            <div class="view-section">
                ${UIFactory.navBar('/upi')}
                ${UIFactory.header('Custom Request', 'Enter amount to generate specific payment matrix.')}
                
                <div class="currency-input-group">
                    <span class="currency-symbol">₹</span>
                    <input type="number" id="amt-input" class="currency-input" placeholder="0.00" autocomplete="off" autofocus>
                </div>

                <div id="dynamic-target" style="opacity: 0.3; pointer-events: none; transition: opacity 0.2s ease;">
                    ${UIFactory.qrDisplay(CoreUtils.getQRUrl(`upi://pay?pa=${SYS_CONFIG.UPI.VPA}&pn=${encodeURIComponent(SYS_CONFIG.UPI.NAME)}`), 'dyn-qr')}
                    
                    <a href="#" id="dyn-pay-btn" class="btn btn-primary" style="margin-top: 16px;">
                        Pay ₹0.00
                    </a>
                </div>

                ${UIFactory.footer()}
            </div>
        `;
    }

    static attachLogic() {
        const input = document.getElementById('amt-input');
        const target = document.getElementById('dynamic-target');
        const img = document.getElementById('dyn-qr');
        const btn = document.getElementById('dyn-pay-btn');

        if(!input) return;

        const updateUI = CoreUtils.debounce((val) => {
            const amount = parseFloat(val);
            if (amount > 0) {
                const intent = `upi://pay?pa=${SYS_CONFIG.UPI.VPA}&pn=${encodeURIComponent(SYS_CONFIG.UPI.NAME)}&am=${amount}&cu=${SYS_CONFIG.UPI.CURRENCY}`;
                
                target.style.opacity = '1';
                target.style.pointerEvents = 'all';
                
                img.style.opacity = '0.4'; // loading state
                img.src = CoreUtils.getQRUrl(intent);
                img.onload = () => img.style.opacity = '1';
                
                btn.href = intent;
                btn.innerText = `Pay ₹${CoreUtils.formatINR(amount)}`;
            } else {
                target.style.opacity = '0.3';
                target.style.pointerEvents = 'none';
                btn.innerText = `Pay ₹0.00`;
            }
        }, 300);

        input.addEventListener('input', (e) => updateUI(e.target.value));
    }
}

/**
 * 6. APPLICATION ROUTER
 * Handles pushState history and DOM replacement.
 */
class AppRouter {
    /**
     * Initializes router listeners
     */
    static init() {
        window.addEventListener('popstate', () => this.resolve());
        this.resolve();
    }

    /**
     * Pushes new path and re-renders
     * @param {string} path 
     */
    static navigate(path) {
        window.history.pushState({}, '', path);
        this.resolve();
    }

    /**
     * Matches current path to view controller
     */
    static resolve() {
        const path = window.location.pathname.toLowerCase().replace(/\/$/, ""); // Normalize path
        const root = document.getElementById('app');
        
        // Fast unmount clean UI
        root.innerHTML = '';
        let viewHtml = '';

        switch (path) {
            case '/upi':
                viewHtml = UPIStandardView.render();
                break;
            case '/upi/custom':
                viewHtml = UPICustomView.render();
                break;
            case '/crypto':
                viewHtml = CryptoView.render();
                break;
            case '/binance':
                viewHtml = BinanceView.render();
                break;
            case '':
            case '/':
                viewHtml = HomeView.render();
                break;
            default:
                // Catchall / 404 handler -> redirect home safely
                window.history.replaceState({}, '', '/');
                viewHtml = HomeView.render();
                break;
        }

        // Mount view
        root.innerHTML = viewHtml;

        // Execute post-render hooks
        if (path === '/upi/custom') {
            UPICustomView.attachLogic();
        }
        
        // Scroll to top
        window.scrollTo(0,0);
    }
}

/**
 * 7. BOOTSTRAPPER
 * Kicks off the application loop.
 */
document.addEventListener('DOMContentLoaded', () => {
    // Suppress rubber-banding scroll on iOS Safari for native app feel
    document.body.addEventListener('touchmove', function(e) {
        if(e.target === document.body) e.preventDefault();
    }, { passive: false });

    // Initialize Routing
    AppRouter.init();
});
