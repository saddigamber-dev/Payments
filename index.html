<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Methods</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Inter,Arial,sans-serif;
    }

    body{
      background:#0f1115;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:380px;
      background:#171a21;
      border:1px solid #2a2f3a;
      border-radius:20px;
      padding:22px;
      box-shadow:0 10px 40px rgba(0,0,0,.35);
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
    }

    .title{
      font-size:20px;
      font-weight:700;
    }

    .status{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background:#1d3323;
      color:#7dff9d;
      font-weight:600;
    }

    .desc{
      color:#b7c0ce;
      font-size:14px;
      line-height:1.5;
      margin-bottom:18px;
    }

    .btn{
      width:100%;
      border:none;
      outline:none;
      text-decoration:none;
      display:block;
      text-align:center;
      padding:14px;
      border-radius:14px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
      margin-bottom:12px;
    }

    .btn:hover{
      transform:translateY(-1px);
      opacity:.95;
    }

    .upi{
      background:#5b5fff;
      color:white;
    }

    .crypto{
      background:#f3ba2f;
      color:black;
    }

    .binance{
      background:#f0b90b;
      color:black;
    }

    .wallet{
      margin-top:10px;
      color:#8e98a8;
      font-size:12px;
      word-break:break-all;
      line-height:1.5;
    }

    .footer{
      margin-top:16px;
      text-align:center;
      color:#687282;
      font-size:12px;
    }
  </style>
</head>
<body>

<div id="app"></div>

<script>
const path = location.pathname.toLowerCase();

function renderHome(){
  return `
    <div class="card">
      <div class="top">
        <div class="title">💳 Payment Methods</div>
        <div class="status">ACTIVE</div>
      </div>

      <div class="desc">
        Select your preferred payment method.
      </div>

      <a class="btn upi" href="/upi">
        🇮🇳 UPI Payment
      </a>

      <a class="btn crypto" href="/crypto">
        ₿ Crypto Payment
      </a>

      <a class="btn binance" href="/binance">
        🟡 Binance UID
      </a>

      <div class="footer">
        Valid payments are processed instantly.
      </div>
    </div>
  `;
}

function renderUPI(){
  return `
    <div class="card">
      <div class="top">
        <div class="title">🇮🇳 UPI Payment</div>
        <div class="status">INSTANT</div>
      </div>

      <div class="desc">
        Google Pay • PhonePe • Paytm
      </div>

      <a class="btn upi"
      href="upi://pay?pa=digamberraj7903@ptaxis&pn=Digamber%20Raj&cu=INR">
        Open UPI App
      </a>

      <div class="footer">
        Send valid screenshot after payment.
      </div>
    </div>
  `;
}

function renderCrypto(){
  return `
    <div class="card">
      <div class="top">
        <div class="title">₿ Crypto Payment</div>
        <div class="status">1-5 MIN</div>
      </div>

      <div class="desc">
        USDT • BTCB • LTC (BEP20)
      </div>

      <a class="btn crypto"
      href="https://link.trustwallet.com/send?coin=20000714&address=0x33aca3a213443730cf548b77b520f4f87df447ec">
        Open Wallet
      </a>

      <div class="wallet">
        0x33aca3a213443730cf548b77b520f4f87df447ec
      </div>

      <div class="footer">
        Blockchain confirmations required.
      </div>
    </div>
  `;
}

function renderBinance(){
  return `
    <div class="card">
      <div class="top">
        <div class="title">🟡 Binance UID</div>
        <div class="status">FASTEST</div>
      </div>

      <div class="desc">
        Internal Binance transfers supported.
      </div>

      <button class="btn binance" onclick="copyUID()">
        Copy Binance UID
      </button>

      <div class="wallet">
        UID: 814429508
      </div>

      <div class="footer">
        Lowest transfer delay available.
      </div>
    </div>
  `;
}

function copyUID(){
  navigator.clipboard.writeText("814429508");
  alert("Binance UID copied");
}

if(path === "/upi"){
  app.innerHTML = renderUPI();
}
else if(path === "/crypto"){
  app.innerHTML = renderCrypto();
}
else if(path === "/binance"){
  app.innerHTML = renderBinance();
}
else{
  app.innerHTML = renderHome();
}
</script>

</body>
</html>
