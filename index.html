<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f1115;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:380px;
background:#171a21;
border:1px solid #2a2f3a;
border-radius:20px;
padding:22px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.title{
font-size:20px;
font-weight:700;
}

.status{
font-size:12px;
background:#1e3325;
color:#7dff9d;
padding:6px 10px;
border-radius:999px;
}

.desc{
font-size:14px;
color:#b8c0cc;
margin-bottom:18px;
line-height:1.5;
}

.btn{
display:block;
width:100%;
padding:14px;
border-radius:14px;
text-decoration:none;
text-align:center;
font-size:14px;
font-weight:700;
margin-bottom:12px;
transition:.2s;
}

.btn:hover{
opacity:.95;
transform:translateY(-1px);
}

.upi{
background:#5b5fff;
color:white;
}

.crypto{
background:#f3ba2f;
color:black;
}

.binance{
background:#f0b90b;
color:black;
border:none;
cursor:pointer;
}

.wallet{
font-size:12px;
color:#8e98a8;
word-break:break-all;
margin-top:10px;
line-height:1.5;
}

.footer{
margin-top:15px;
text-align:center;
font-size:12px;
color:#6b7280;
}
</style>
</head>

<body>

<div id="app"></div>

<script>
const path = location.pathname.toLowerCase();

function home(){
return `
<div class="card">

<div class="top">
<div class="title">💳 Payment Methods</div>
<div class="status">ACTIVE</div>
</div>

<div class="desc">
Choose your payment method below.
</div>

<a class="btn upi" href="/upi">
🇮🇳 UPI Payment
</a>

<a class="btn crypto" href="/crypto">
₿ Crypto Payment
</a>

<a class="btn binance" href="/binance">
🟡 Binance UID
</a>

<div class="footer">
Instant processing available.
</div>

</div>
`;
}

function upi(){
return `
<div class="card">

<div class="top">
<div class="title">🇮🇳 UPI Payment</div>
<div class="status">INSTANT</div>
</div>

<div class="desc">
Google Pay • PhonePe • Paytm
</div>

<a class="btn upi"
href="upi://pay?pa=digamberraj7903@ptaxis&pn=Digamber%20Raj&cu=INR">
Open UPI App
</a>

<div class="footer">
Send valid screenshot after payment.
</div>

</div>
`;
}

function crypto(){
return `
<div class="card">

<div class="top">
<div class="title">₿ Crypto Payment</div>
<div class="status">1-5 MIN</div>
</div>

<div class="desc">
USDT • BTCB • LTC (BEP20)
</div>

<a class="btn crypto"
href="https://link.trustwallet.com/send?coin=20000714&address=0x33aca3a213443730cf548b77b520f4f87df447ec">
Open Wallet
</a>

<div class="wallet">
0x33aca3a213443730cf548b77b520f4f87df447ec
</div>

<div class="footer">
Blockchain confirmations required.
</div>

</div>
`;
}

function binance(){
return `
<div class="card">

<div class="top">
<div class="title">🟡 Binance UID</div>
<div class="status">FASTEST</div>
</div>

<div class="desc">
Internal Binance transfer supported.
</div>

<button class="btn binance" onclick="copyUID()">
Copy Binance UID
</button>

<div class="wallet">
UID: 814429508
</div>

<div class="footer">
Lowest transfer delay available.
</div>

</div>
`;
}

function copyUID(){
navigator.clipboard.writeText("814429508");
alert("Binance UID copied");
}

if(path === "/upi"){
app.innerHTML = upi();
}
else if(path === "/crypto"){
app.innerHTML = crypto();
}
else if(path === "/binance"){
app.innerHTML = binance();
}
else{
app.innerHTML = home();
}
</script>

</body>
</html>
