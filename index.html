<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smgrowmart Payments</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#0f172a;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.card{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:20px;
    padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.header{
    text-align:center;
    margin-bottom:24px;
}

.header h1{
    font-size:28px;
    margin-bottom:8px;
}

.header p{
    color:#94a3b8;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.tab{
    flex:1;
    border:none;
    background:#334155;
    color:white;
    padding:12px;
    border-radius:12px;
    cursor:pointer;
    font-weight:600;
}

.tab.active{
    background:#6366f1;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.qr{
    width:220px;
    height:220px;
    margin:20px auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
}

.qr img{
    width:100%;
    height:100%;
}

.label{
    font-size:12px;
    color:#94a3b8;
    margin-bottom:6px;
}

.value{
    background:#0f172a;
    border:1px solid #334155;
    border-radius:12px;
    padding:14px;
    word-break:break-all;
    margin-bottom:12px;
}

.input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:12px;
    font-size:16px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#6366f1;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}
</style>
</head>
<body>

<div class="container">
<div class="card">

<div class="header">
<h1>Smgrowmart Payments</h1>
<p>Select your preferred payment method</p>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('upi',this)">UPI</button>
<button class="tab" onclick="showTab('crypto',this)">Crypto</button>
<button class="tab" onclick="showTab('binance',this)">Binance</button>
</div>

<!-- UPI -->

<div class="section active" id="upi">

<input
id="amount"
class="input"
type="number"
placeholder="Enter Amount">

<div class="qr">
<img id="upiQr">
</div>

<div class="label">UPI ID</div>
<div class="value">Smgrowmarthq@upi</div>

<a id="payBtn">
<button class="btn">
Pay Now
</button>
</a>

</div>

<!-- Crypto -->

<div class="section" id="crypto">

<div class="qr">
<img id="cryptoQr">
</div>

<div class="label">Wallet Address</div>

<div class="value">
0x33aca3a213443730cf548b77b520f4f87df447ec
</div>

<button class="btn"
onclick="copyText('0x33aca3a213443730cf548b77b520f4f87df447ec')">
Copy Address
</button>

</div>

<!-- Binance -->

<div class="section" id="binance">

<div class="qr">
<img id="binanceQr">
</div>

<div class="label">Binance UID</div>

<div class="value">
814429508
</div>

<button class="btn"
onclick="copyText('814429508')">
Copy UID
</button>

</div>

</div>
</div>

<script>

const UPI_ID="Smgrowmarthq@upi";
const NAME="Smgrowmart HQ";

function qr(data){
    return "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="
    + encodeURIComponent(data);
}

function showTab(id,btn){

    document.querySelectorAll('.section')
    .forEach(x=>x.classList.remove('active'));

    document.querySelectorAll('.tab')
    .forEach(x=>x.classList.remove('active'));

    document.getElementById(id)
    .classList.add('active');

    btn.classList.add('active');
}

function copyText(text){
    navigator.clipboard.writeText(text);
    alert("Copied");
}

function updateUPI(){

    const amount=
    document.getElementById('amount').value;

    let intent=
    `upi://pay?pa=${UPI_ID}&pn=${NAME}`;

    if(amount && amount>0){
        intent += `&am=${amount}&cu=INR`;
    }

    document.getElementById('upiQr').src=
    qr(intent);

    document.getElementById('payBtn').href=
    intent;
}

document.getElementById('amount')
.addEventListener('input',updateUPI);

document.getElementById('cryptoQr').src=
qr('0x33aca3a213443730cf548b77b520f4f87df447ec');

document.getElementById('binanceQr').src=
qr('814429508');

updateUPI();

</script>

</body>
</html>
