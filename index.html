<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f1115;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:390px;
background:#171a21;
border:1px solid #2a2f3a;
border-radius:22px;
padding:22px;
box-shadow:0 10px 40px rgba(0,0,0,.35);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.title{
font-size:20px;
font-weight:700;
}

.status{
font-size:12px;
background:#1e3325;
color:#7dff9d;
padding:6px 10px;
border-radius:999px;
font-weight:700;
}

.desc{
font-size:14px;
color:#b8c0cc;
margin-bottom:18px;
line-height:1.5;
}

.btn{
display:block;
width:100%;
padding:14px;
border-radius:14px;
text-decoration:none;
text-align:center;
font-size:14px;
font-weight:700;
margin-bottom:12px;
transition:.2s;
border:none;
cursor:pointer;
}

.btn:hover{
opacity:.95;
transform:translateY(-1px);
}

.upi{
background:#5b5fff;
color:white;
}

.crypto{
background:#f3ba2f;
color:black;
}

.binance{
background:#f0b90b;
color:black;
}

.footer{
margin-top:15px;
text-align:center;
font-size:12px;
color:#6b7280;
line-height:1.5;
}

.wallet{
font-size:12px;
color:#8e98a8;
margin-top:15px;
word-break:break-all;
text-align:center;
line-height:1.5;
}

#qrcode{
display:flex;
justify-content:center;
margin-top:18px;
}

#qrcode img{
background:white;
padding:10px;
border-radius:14px;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

const path = location.pathname.toLowerCase();

const UPI_ID = "digamberraj7903@ptaxis";
const UPI_NAME = "Digamber Raj";

const BINANCE_UID = "814429508";

const WALLET =
"0x33aca3a213443730cf548b77b520f4f87df447ec";

function home(){

return `

<div class="card">

<div class="top">
<div class="title">💳 Payment Methods</div>
<div class="status">ACTIVE</div>
</div>

<div class="desc">
Choose your preferred payment method.
</div>

<a class="btn upi" href="/upi">
🇮🇳 UPI Payment
</a>

<a class="btn crypto" href="/crypto">
₿ Crypto Payment
</a>

<a class="btn binance" href="/binance">
🟡 Binance UID
</a>

<div class="footer">
Instant payment processing available.
</div>

</div>

`;

}

function upi(){

const upiPayload =
`upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(UPI_NAME)}&am=&cu=INR`;

setTimeout(() => {
window.location.href = upiPayload;
},1500);

return `

<div class="card">

<div class="top">
<div class="title">🇮🇳 UPI Payment</div>
<div class="status">INSTANT</div>
</div>

<div class="desc">
Attempting to open your UPI app automatically.
</div>

<a class="btn upi" href="${upiPayload}">
Open UPI App
</a>

<div id="qrcode"></div>

<div class="footer">
Scan QR if app did not open automatically.
</div>

</div>

`;

}

function crypto(){

return `

<div class="card">

<div class="top">
<div class="title">₿ Crypto Payment</div>
<div class="status">1-5 MIN</div>
</div>

<div class="desc">
Select your preferred BEP20 asset.
</div>

<button class="btn crypto"
onclick="showQR('USDT Address')">
Copy USDT Address
</button>

<button class="btn crypto"
onclick="showQR('Bitcoin Address')">
Copy Bitcoin Address
</button>

<button class="btn crypto"
onclick="showQR('Litecoin Address')">
Copy Litecoin Address
</button>

<button class="btn crypto"
onclick="showQR('Ethereum Address')">
Copy Ethereum Address
</button>

<button class="btn crypto"
onclick="showQR('ZCash Address')">
Copy ZCash Address
</button>

<button class="btn crypto"
onclick="showQR('BNB Address')">
Copy BNB Address
</button>

<div id="qrcode"></div>

<div class="wallet" id="walletText"></div>

<div class="footer">
Tap any asset to generate QR instantly.
</div>

</div>

`;

}

function binance(){

return `

<div class="card">

<div class="top">
<div class="title">🟡 Binance UID</div>
<div class="status">FASTEST</div>
</div>

<div class="desc">
Internal Binance transfers supported.
</div>

<button class="btn binance"
onclick="copyUID()">
Copy Binance UID
</button>

<div id="qrcode"></div>

<div class="wallet">
UID: ${BINANCE_UID}
</div>

<div class="footer">
Scan QR or copy UID manually.
</div>

</div>

`;

}

function showQR(name){

navigator.clipboard.writeText(WALLET);

document.getElementById("walletText").innerHTML =
name + "<br><br>" + WALLET;

document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"),{
text: WALLET,
width:180,
height:180,
correctLevel:QRCode.CorrectLevel.H
});

alert(name + " copied");

}

function copyUID(){

navigator.clipboard.writeText(BINANCE_UID);

document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"),{
text: BINANCE_UID,
width:180,
height:180,
correctLevel:QRCode.CorrectLevel.H
});

alert("Binance UID copied");

}

if(path === "/upi"){

app.innerHTML = upi();

setTimeout(() => {

const upiPayload =
`upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(UPI_NAME)}&am=&cu=INR`;

const qrContainer =
document.getElementById("qrcode");

qrContainer.innerHTML = "";

new QRCode(qrContainer,{
text: upiPayload,
width:180,
height:180,
correctLevel:QRCode.CorrectLevel.H
});

},200);

}

else if(path === "/crypto"){

app.innerHTML = crypto();

}

else if(path === "/binance"){

app.innerHTML = binance();

}

else{

app.innerHTML = home();

}

</script>

</body>
</html>
